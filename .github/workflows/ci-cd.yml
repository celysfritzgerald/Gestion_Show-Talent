name: CI/CD Pipeline — Show Talent

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# Empêche 2 déploiements simultanés sur la même branche
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  FLASK_ENV: testing
  SECRET_KEY: 'ci-test-secret-key-not-for-production'

jobs:
  # ═══════════════════════════════════════════════════════════
  # JOB 1 : LINT + SÉCURITÉ
  # ═══════════════════════════════════════════════════════════
  quality:
    name: 🔍 Lint & Sécurité
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4

      - name: 🐍 Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 Installer les dépendances de dev
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 bandit

      - name: 🔍 Lint (flake8)
        run: |
          # Ne bloque pas le pipeline si échec — juste informatif
          flake8 app/ --max-line-length=120 --exclude=migrations --exit-zero

      - name: 🛡️ Scan de sécurité (bandit)
        run: |
          # Ne bloque pas le pipeline — informatif
          bandit -r app/ -ll --exit-zero

  # ═══════════════════════════════════════════════════════════
  # JOB 2 : TESTS (avec PostgreSQL réel)
  # ═══════════════════════════════════════════════════════════
  test:
    name: 🧪 Tests (PostgreSQL)
    runs-on: ubuntu-latest
    needs: quality

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4

      - name: 🐍 Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: 🧪 Lancer les tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          SECRET_KEY: ${{ env.SECRET_KEY }}
        run: |
          pytest tests/ -v --tb=short

  # ═══════════════════════════════════════════════════════════
  # JOB 3 : DÉPLOIEMENT (uniquement sur push vers main/master)
  # ═══════════════════════════════════════════════════════════
  deploy:
    name: 🚀 Déployer sur Railway
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4

      - name: 🚂 Installer Railway CLI
        run: npm install -g @railway/cli

      - name: 🚀 Déployer
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --service=${{ secrets.RAILWAY_SERVICE }} --detach

      - name: ✅ Healthcheck post-déploiement
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          echo "⏳ Attente 30s pour que l'app démarre..."
          sleep 30
          echo "🔍 Test du endpoint /health..."
          for i in 1 2 3 4 5; do
            if curl -fsS "$APP_URL/health"; then
              echo ""
              echo "✅ Déploiement réussi !"
              exit 0
            fi
            echo "Tentative $i/5 échouée, retry dans 15s..."
            sleep 15
          done
          echo "❌ Healthcheck échoué après 5 tentatives"
          exit 1

      - name: 📢 Résumé du déploiement
        if: always()
        run: |
          echo "### 🚀 Déploiement Show Talent" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Auteur**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Heure**: $(date -u)" >> $GITHUB_STEP_SUMMARY
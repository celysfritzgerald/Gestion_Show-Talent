{% extends "base.html" %}

{% block title %}Gestion des Critères{% endblock %}

{% block extra_css %}
<style>
    .form-container {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 20px;
        padding: 24px;
        transition: all 0.3s ease;
    }
    
    .form-container:hover {
        border-color: rgba(34, 197, 94, 0.15);
    }
    
    .form-label {
        color: #94a3b8;
        font-size: 0.85rem;
        font-weight: 500;
        display: block;
        margin-bottom: 6px;
    }
    
    .form-input {
        width: 100%;
        padding: 12px 16px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        color: #e2e8f0;
        transition: all 0.3s ease;
        font-size: 0.95rem;
    }
    
    .form-input:focus {
        outline: none;
        border-color: #22c55e;
        box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.15);
        background: rgba(255, 255, 255, 0.08);
    }
    
    .form-input::placeholder {
        color: #475569;
    }
    
    textarea.form-input {
        resize: vertical;
        min-height: 80px;
    }
    
    .btn-submit {
        padding: 12px 24px;
        background: linear-gradient(135deg, #22c55e, #16a34a);
        color: #fff;
        border: none;
        border-radius: 12px;
        font-size: 0.95rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s ease;
        width: 100%;
    }
    
    .btn-submit:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(34, 197, 94, 0.4);
    }
    
    .btn-edit {
        padding: 8px 16px;
        background: rgba(59, 130, 246, 0.15);
        color: #60a5fa;
        border: none;
        border-radius: 8px;
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
    }
    
    .btn-edit:hover {
        background: rgba(59, 130, 246, 0.25);
    }
    
    .btn-delete {
        padding: 8px 16px;
        background: rgba(239, 68, 68, 0.15);
        color: #f87171;
        border: none;
        border-radius: 8px;
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
    }
    
    .btn-delete:hover {
        background: rgba(239, 68, 68, 0.25);
    }
    
    .btn-force {
        padding: 8px 16px;
        background: rgba(251, 191, 36, 0.15);
        color: #fbbf24;
        border: none;
        border-radius: 8px;
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
    }
    
    .btn-force:hover {
        background: rgba(251, 191, 36, 0.25);
    }
    
    .criterion-item {
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.04);
        border-radius: 14px;
        padding: 16px;
        transition: all 0.3s ease;
    }
    
    .criterion-item:hover {
        background: rgba(255, 255, 255, 0.04);
        border-color: rgba(34, 197, 94, 0.1);
    }
    
    @media (max-width: 768px) {
        .form-container {
            padding: 16px;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="py-8" style="background: #0B1120;">
    <div class="container mx-auto px-4">
        
        <div class="flex items-center gap-3 mb-6">
            <h1 class="text-2xl font-bold text-white">Gestion des Critères</h1>
            <span class="text-sm text-gray-400">({{ criteria|length }} critères)</span>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            
            <!-- Formulaire d'ajout -->
            <div class="form-container">
                <h2 class="text-lg font-bold text-white mb-4">
                    <i class="fas fa-plus-circle text-green-400 mr-2"></i>Ajouter un critère
                </h2>
                <form method="POST" action="{{ url_for('admin.create_criterion') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    
                    <div class="space-y-4">
                        <div>
                            <label class="form-label">Nom du critère <span class="required">*</span></label>
                            <input type="text" name="name" required class="form-input" placeholder="Ex: Technique vocale">
                        </div>
                        <div>
                            <label class="form-label">Description</label>
                            <textarea name="description" rows="3" class="form-input" placeholder="Description du critère"></textarea>
                        </div>
                        <button type="submit" class="btn-submit">
                            <i class="fas fa-plus mr-2"></i>Ajouter le critère
                        </button>
                    </div>
                </form>
            </div>

            <!-- Liste des critères -->
            <div class="form-container">
                <h2 class="text-lg font-bold text-white mb-4">
                    <i class="fas fa-list text-green-400 mr-2"></i>Critères existants
                </h2>
                
                <div class="space-y-3 max-h-[500px] overflow-y-auto">
                    {% for criterion in criteria %}
                    <div class="criterion-item">
                        <form method="POST" action="{{ url_for('admin.edit_criterion', criterion_id=criterion.id) }}" class="space-y-3">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                            
                            <div>
                                <input type="text" name="name" value="{{ criterion.name }}" required
                                       class="form-input" style="padding: 8px 12px; font-size: 0.9rem;">
                            </div>
                            <div>
                                <textarea name="description" rows="2" 
                                          class="form-input" style="padding: 8px 12px; font-size: 0.85rem; min-height: 50px;">{{ criterion.description or '' }}</textarea>
                            </div>
                            <div class="flex gap-2 flex-wrap">
                                <button type="submit" class="btn-edit flex-1">
                                    <i class="fas fa-save mr-1"></i>Modifier
                                </button>
                                <form method="POST" action="{{ url_for('admin.delete_criterion', criterion_id=criterion.id) }}" class="flex-1">
                                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                                    <button type="submit" class="btn-delete w-full" onclick="return confirm('Supprimer ce critère ?')">
                                        <i class="fas fa-trash mr-1"></i>Supprimer
                                    </button>
                                </form>
                                <form method="POST" action="{{ url_for('admin.force_delete_criterion', criterion_id=criterion.id) }}" class="flex-1">
                                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                                    <button type="submit" class="btn-force w-full" onclick="return confirm('⚠️ Suppression forcée ?')">
                                        <i class="fas fa-exclamation-triangle mr-1"></i>Force
                                    </button>
                                </form>
                            </div>
                        </form>
                    </div>
                    {% endfor %}
                </div>
            </div>
            
        </div>
    </div>
</div>
{% endblock %}
